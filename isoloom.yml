# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# OWASP SKF Pickle Deserialization (OWASP Security Knowledge Framework labs, by Glenn ten Cate, Riccardo ten Cate and the SKF contributors) as an Isoloom spec:
# a Flask app that unpickles a hex-encoded object posted by the user (insecure deserialization). The SKF lab folder python/DES-Pickle is
# vendored unchanged in app/ and built by its own Dockerfile through an overlay
# (build/web/Dockerfile) that adds the flag folder /ctf.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: skf-des-pickle

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.60.152.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 5000, name: web, http: true, publish: 5050 }]
    resources: { cpus: 1, memory_mb: 256 }
    inputs: [CTF_FLAG_MAIN]
    volumes: { ctf: /ctf }   # the flag, written by ctf/flag.sh at every start
    docker:
      build: app
      dockerfile: build/web/Dockerfile
      init: [ctf/flag.sh]

checks:
  - name: the lab answers
    http: http://web:5000/
    wait: 120
  - name: the sync form posts a serialized object to /sync
    script: checks/form.sh

message: |
  OWASP SKF Pickle Deserialization answers at http://localhost:{{ machines.web.services.0.publish }}/.
  The page shows a deserialized object; the form sends one back as hex to /sync.
